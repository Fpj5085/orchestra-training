<!DOCTYPE html>
<html lang="zh">
<head><meta charset="utf-8"><title>我的成绩 - 乐团识谱训练</title>
<style>
:root{--bg:#10141f;--panel:#1a2130;--line:#2a3550;--ink:#e8ecf7;--sub:#8fa0c5;--gold:#ffc857}
body{font-family:"Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--ink);max-width:900px;margin:0 auto;padding:20px 16px 60px}
h1{font-size:20px;color:var(--gold);margin:8px 0 4px}
#who{color:var(--sub);font-size:13px}
fieldset{background:var(--panel);border:1px solid var(--line);border-radius:10px;margin:14px 0;padding:12px 14px}
legend{color:var(--gold);font-size:13px;padding:0 6px}
input,button{font:inherit}
input{background:#0d1119;border:1px solid var(--line);border-radius:6px;color:var(--ink);padding:7px 10px;margin:2px 4px 2px 0;width:200px}
button{background:var(--gold);color:#1a1400;border:0;border-radius:6px;padding:7px 14px;cursor:pointer;font-weight:600}
button.ghost{background:transparent;color:var(--sub);border:1px solid var(--line)}
table{width:100%;border-collapse:collapse;margin-top:10px;font-size:13px}
th{color:var(--sub);text-align:left;border-bottom:1px solid var(--line);padding:6px 8px}
td{border-bottom:1px solid #232c42;padding:6px 8px}
.cards{display:flex;gap:12px;flex-wrap:wrap;margin-top:10px}
.card{flex:1;min-width:120px;background:#0d1119;border:1px solid var(--line);border-radius:10px;padding:12px}
.card .v{font-size:22px;color:var(--gold);font-weight:700}
.card .k{font-size:11px;color:var(--sub)}
</style></head>
<body>
<h1>我的成绩 — 学生端</h1>
<span id="who">未登录</span>

<fieldset><legend>登录</legend>
  账号 <input id="username" placeholder="student01"> 密码 <input id="password" type="password" placeholder="student123">
  <button onclick="login()">登录</button>
  <button class="ghost" onclick="load()">刷新我的成绩</button>
</fieldset>

<fieldset><legend>我的统计</legend>
  <div class="cards">
    <div class="card"><div class="v" id="cCount">-</div><div class="k">练习次数</div></div>
    <div class="card"><div class="v" id="cAvg">-</div><div class="k">平均分</div></div>
    <div class="card"><div class="v" id="cBest">-</div><div class="k">最佳成绩</div></div>
    <div class="card"><div class="v" id="cToday">-</div><div class="k">今日练习</div></div>
  </div>
  <table id="dailyTable"><thead><tr><th>日期</th><th>练习次数</th><th>平均分</th><th>最佳</th></tr></thead><tbody></tbody></table>
</fieldset>

<fieldset><legend>成绩明细（GET /api/records/me）</legend>
  <table id="recordTable"><thead><tr><th>ID</th><th>乐器</th><th>任务</th><th>分数</th><th>准确率</th><th>时长ms</th><th>提交时间</th></tr></thead><tbody></tbody></table>
</fieldset>

<script>
const API_BASE = localStorage.getItem('orc_api_base') || 'http://localhost:8083';
let token = localStorage.getItem('orc_token') || '';
document.getElementById('who').textContent = token ? '已登录（来自 auth.html 的会话）' : '未登录';

async function api(method, path, body) {
  const res = await fetch(API_BASE + path, {
    method, headers: { 'Content-Type': 'application/json', ...(token ? { Authorization: 'Bearer ' + token } : {}) },
    body: body ? JSON.stringify(body) : undefined
  });
  const text = await res.text();
  if (!res.ok) throw new Error(res.status + ' ' + text.slice(0, 120));
  return text ? JSON.parse(text) : null;
}
const esc = (x) => x === null || x === undefined ? '-' : String(x);
const fmtTime = (s) => esc(s).replace('T', ' ').slice(0, 19);
const rows = (id, items, cells) => {
  document.querySelector('#' + id + ' tbody').innerHTML =
    items.map(it => '<tr>' + cells(it).map(c => '<td>' + c + '</td>').join('') + '</tr>').join('');
};

async function login() {
  const d = await api('POST', '/api/auth/login', { username: val('username'), password: val('password'), role: 'STUDENT' });
  token = d.token;
  localStorage.setItem('orc_token', token);
  localStorage.setItem('orc_api_base', API_BASE);
  localStorage.setItem('orc_role', d.role);
  localStorage.setItem('orc_me', d.username);
  document.getElementById('who').textContent = '已登录: ' + d.name;
  load();
}

async function load() {
  const records = await api('GET', '/api/records/me');
  const stats = await api('GET', '/api/students/' + localStorage.getItem('orc_me') + '/stats').catch(() => null);
  rows('recordTable', records, r => [r.id, esc(r.instrumentId), r.taskId === null ? '自由练习' : '#' + r.taskId,
    r.score === null ? '-' : r.score, r.accuracy === null ? '-' : r.accuracy, esc(r.durationMs), fmtTime(r.submittedAt)]);
  if (stats) {
    document.getElementById('cCount').textContent = stats.count;
    document.getElementById('cAvg').textContent = Math.round(stats.avgScore * 10) / 10;
    document.getElementById('cBest').textContent = Math.round(stats.bestScore * 10) / 10;
    const today = new Date().toISOString().slice(0, 10);
    const t = (stats.daily || []).find(d => d.statDate === today);
    document.getElementById('cToday').textContent = t ? t.practiceCount : 0;
    rows('dailyTable', stats.daily || [], d => [d.statDate, d.practiceCount, Math.round(d.avgScore * 10) / 10, Math.round(d.bestScore * 10) / 10]);
  }
}
const val = (id) => document.getElementById(id).value.trim();
if (token) load();
</script>
</body>
</html>
