server:
  port: 8083
spring:
  datasource:
    url: jdbc:postgresql://localhost:55434/orchestra
    username: orchestra
    password: orchestra
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
app:
  jwt:
    secret: ${APP_JWT_SECRET:orc-local-demo-secret-please-rotate-0123456789abcdef}  # compose 传入 APP_JWT_SECRET（见 docker-compose.yml）；本地直跑用演示默认值，生产必须设置
    ttl-minutes: 720
